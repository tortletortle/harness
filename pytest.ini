# Pytest配置

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow
    integration: marks tests as integration tests

addopts =
    --cov=python
    --cov-report=html
    --cov-report=term-missing
