# Pytest配置

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 标记
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

# 覆盖率
addopts = [
    "--cov=python",
    "--cov-report=html",
    "--cov-report=term-missing",
]
