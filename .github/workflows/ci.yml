name: CI

on:
  push:
    branches:
      - main
      - "fix/*"
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r python/requirements.txt

      - name: Run offline Python tests
        # 真实 LLM/浏览器用例依赖外部密钥、网络或 Chromium，单独手动运行。
        run: pytest -q --ignore=tests/python/test_exec_e2e.py --ignore=tests/python/test_browser_check.py

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Workspace Cargo.toml 在仓库根目录（[workspace] members = rust/*），
      # 因此 rust-cache 使用默认工作目录，无需 workspaces 参数。
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --workspace
