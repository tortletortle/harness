[project]
name = "eas-python"
version = "0.2.0"
description = "EAS 2.0 Python AI Services"
requires-python = ">=3.10"
authors = [
    {name = "EAS Team"}
]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.3",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
