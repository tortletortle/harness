# Alembic config for EAS 2.0 SQLite schema migrations.
# NOTE: keep this file ASCII-only -- alembic reads it with the system
# locale encoding (GBK on zh-CN Windows). Docs: docs/DB_MIGRATIONS.md
#
# Usage (from repo root):
#   python -m alembic current
#   python -m alembic upgrade head
#   python -m alembic revision -m "description"
# DB path defaults to data/eas.db; override with env var EAS_DB_PATH.

[alembic]
script_location = python/migrations
prepend_sys_path = python
# URL is generated dynamically in env.py from EAS_DB_PATH; this is a fallback.
sqlalchemy.url = sqlite:///data/eas.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

