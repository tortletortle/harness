# 数据库配置

database:
  # 默认使用 SQLite，生产环境切换到 PostgreSQL
  type: sqlite  # 或 postgres
  
  sqlite:
    path: ./data/eas.db
    
  postgres:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:eas}
    user: ${DB_USER:eas_user}
    password: ${DB_PASSWORD}
    
  # 连接池配置
  pool:
    min_connections: 2
    max_connections: 10
    connection_timeout: 30
    idle_timeout: 300

# 日志数据库（可以与主数据库分离）
log_database:
  type: sqlite
  sqlite:
    path: ./data/logs.db
