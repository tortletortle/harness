# ============================================================================
# 运行时生效配置 = 本文件 + config/models.local.yaml + .env（后者优先）。
#
# 重要：下面 api_keys / base_urls 只是占位骨架，不是真实值。真实密钥只从环境
# 变量 EAS_LLM_API_KEY_<PROVIDER> 读取，真实地址来自 models.local.yaml 或
# EAS_LLM_BASE_URL_<PROVIDER>。任何直接读取本文件 api_keys 的脚本都会拿到
# 占位符并稳定报 401——2026-09-28 修掉的 scripts/test_api_connectivity.py 就
# 踩过这个坑。要看真实状态请跑：
#     python scripts/test_api_connectivity.py     # 全角色主备真实探测
#     python scripts/check_models.py              # CI 闸门，主模型 DEAD 即非零退出
#
# 2026-09-28 实测：bbapi / newapi 密钥已失效（401），hejuapi 端点 404。
# 这三个 provider 目前均不可用，仅 stepfun（聚合）/ 国模 / stepfun_official 可用。
#
# ---------------------------------------------------------------------------
# 2026-09-28 模型清单刷新（out/model-acceptance-20260928/ADDENDUM-model-refresh.md）
#
# 国模 端点现有 18 个模型，实测可用 17 个。当前各角色 primary 仍用 glm-5.2，
# 属于**有意保持不变**（稳定优先），但以下事实已确认，需要时可直接切换：
#
#   * glm-5.3 / glm-5.3-flash 已上线。glm-5.3 单次采样 2712ms，比在用的
#     glm-5.2（4535ms）更快；glm-5.3-flash 名字带 flash 但实测 11299ms 最慢，
#     不要被命名误导。
#   * 其他可用新型号：kimi-k3、minimax-m3、qwen3.7-max、qwen3.7-plus、
#     qwen3.8-max-0902、deepseek-v4.1-flash、deepseek-v4-flash(-0731)。
#   * ⚠ deepseek-v4-pro-0813 是「假活」：HTTP 200 但 content 为空。
#     check_models.py 用 max_tokens=1 探测会把它误判成 OK，不要选它。
#   * 换 primary 属于质量相关变更，切换后必须重跑 A/B/C 真实验收再上线。
#
# 刷新命令：python out/model-acceptance-20260928/refresh_models.py
# ---------------------------------------------------------------------------
# ============================================================================
api_keys:
  bbapi: PUT-REAL-KEY-IN-config/models.local.yaml
  hejuapi: PUT-REAL-KEY-IN-config/models.local.yaml
  newapi: PUT-REAL-KEY-IN-config/models.local.yaml
  stepfun: PUT-REAL-KEY-IN-config/models.local.yaml
base_urls:
  bbapi: https://www.bb-api.com/v1
  hejuapi: https://www.hejuapi.com/v1
  newapi: https://newapi.dragon3api.com/v1
  stepfun: https://api.stepfun.com/step_plan/v1
models:
  codegen:
    fallback:
      max_tokens: 16000
      model: step-3.5-flash
      provider: stepfun
      temperature: 0.2
    primary:
      max_tokens: 16000
      model: step-3.7-flash
      provider: stepfun
      temperature: 0.2
  designer:
    fallback:
      max_tokens: 16000
      model: step-3.5-flash
      provider: stepfun
      temperature: 0.3
    primary:
      max_tokens: 16000
      model: step-3.7-flash
      provider: stepfun
      temperature: 0.3
  executor:
    primary:
      max_tokens: 4000
      # 2026-09-26: step-3.5-flash-2603 在配置的 stepfun 端点已 403（下线/改名），
      # 改为该端点实测可用的 qwen3.8-max（真实验收曾靠 fallback 兜到它才成功）。
      model: qwen3.8-max
      provider: stepfun
      temperature: 0.1
    # 受控并行：max_concurrency=1 为严格串行（默认，行为与旧版一致）。
    # 计划内批级并行需同时满足：parallel_graphs=true 且计划声明 depends_on。
    max_concurrency: 1
  knowledge:
    fallback:
      max_tokens: 4000
      model: step-3.5-flash
      provider: stepfun
      temperature: 0.2
    primary:
      max_tokens: 4000
      model: step-3.7-flash
      provider: stepfun
      temperature: 0.2
  stepfun_asr:
    fallback:
      max_tokens: 4000
      model: stepaudio-2.5-asr
      provider: stepfun
      temperature: 0.1
    primary:
      max_tokens: 4000
      model: step-asr-1.1
      provider: stepfun
      temperature: 0.1
  stepfun_audio:
    fallback:
      max_tokens: 4000
      model: stepaudio-2.5-chat
      provider: stepfun
      temperature: 0.3
    primary:
      max_tokens: 4000
      model: step-audio-2
      provider: stepfun
      temperature: 0.3
  stepfun_chat:
    fallback:
      max_tokens: 4000
      model: step-2x-large
      provider: stepfun
      temperature: 0.3
    primary:
      max_tokens: 4000
      model: step-3.5-flash
      provider: stepfun
      temperature: 0.3
  stepfun_image_edit:
    primary:
      max_tokens: 4000
      model: step-image-edit-2
      provider: stepfun
      temperature: 0.3
  stepfun_search:
    primary:
      max_tokens: 4000
      model: dr-search-api
      provider: stepfun
      temperature: 0.2
  stepfun_tts:
    fallback:
      max_tokens: 4000
      model: stepaudio-2.5-tts
      provider: stepfun
      temperature: 0.3
    primary:
      max_tokens: 4000
      model: step-tts-2
      provider: stepfun
      temperature: 0.3
  toolmanager:
    # 2026-09-28: 本骨架里的 newapi / bbapi 密钥实测 401，这两条都不可用。
    # 运行时由 models.local.yaml 覆盖为 国模/glm-5.2 + stepfun/qwen3.8-max（已验证 OK）。
    # 若哪天移除了 models.local.yaml 的覆盖，这里会立刻整条链路崩掉——先换 provider。
    fallback:
      max_tokens: 4000
      model: claude-sonnet-5
      provider: bbapi
      temperature: 0.1
    primary:
      max_tokens: 4000
      model: claude-haiku-4-5-20251001
      provider: newapi
      temperature: 0.1
  # ---------------------------------------------------------------------------
  # vision：2026-09-28 停用（死配置）。
  #
  # 证据：step-gui 与 step-1o-turbo-vision 在全部 6 个已配置 provider 上逐一探测
  # 均不可用（stepfun 403 / stepfun_official 404 / 国模 404 / bbapi 401 /
  # newapi 401 / hejuapi 404）；拉 /models 清单确认两个可用端点都不提供视觉模型：
  #   stepfun          : deepseek-v4-pro, glm-5.1, glm-5.2, kimi-k2.6,
  #                      kimi-k2.7-code, qwen3.8-max
  #   stepfun_official : step-3.5-flash, step-3.5-flash-2603, step-3.7-flash,
  #                      step-5-preview, step-image-edit-2, step-router-v1,
  #                      stepaudio-2.5-{asr,chat,realtime,tts}
  # 即当前订阅下没有任何可用视觉模型，不是 provider 指错。
  #
  # 全仓库检索 "vision" 无任何代码消费点，因此整块注释掉而非留着让探测常红。
  # 恢复方法：确认订阅含视觉模型后，取消注释并把 model/provider 改成真实可用项。
  # 证据留档：out/model-acceptance-20260928/
  # ---------------------------------------------------------------------------
  # vision:
  #   fallback:
  #     max_tokens: 4000
  #     model: step-1o-turbo-vision
  #     provider: stepfun
  #     temperature: 0.1
  #   primary:
  #     max_tokens: 4000
  #     model: step-gui
  #     provider: stepfun
  #     temperature: 0.1
rate_limit:
  requests_per_minute: 50
  tokens_per_minute: 100000

# 计划内批级并行总开关（默认关闭 = 旧串行行为）。开启后仅对声明了
# depends_on 的显式依赖图生效；旧线性计划仍逐步骤串行。
parallel_graphs: false
retry:
  backoff_factor: 2
  max_attempts: 3
  timeout: 60
# Runtime 临时授权：每个 API 步骤单独签发，执行后撤销。
# allowed_hosts 留空表示网络工具必须显式配置目标主机，不会被 Grant 默认放行。
authorization:
  enforce: true
  require_grant: true
  allow_absolute_paths: true
  default_ttl_seconds: 600
  default_max_tool_calls: 1
  default_max_model_calls: 3
  default_max_elapsed_seconds: 600
  deny_resources:
    - .env
    - .env.*
    - .git/**
  allowed_hosts: []

# P0 强化：计划级 token 预算（0 = 不限制；超限自动转 Paused，可 /resume 继续）
budget:
  max_tokens_per_plan: 0


# MCP 生态集成：外部 MCP server 的工具会包装成 Capability 并走 Grant 边界（设计稿 1.11）。
# enabled: false 或缺省 command 的条目会被跳过；单 server 接入失败不影响主服务。
mcp_servers:
  notion:
    # 2026-09-01 根因修复：此前 tools/list 超时的原因是 asyncio 流默认 64KB 行上限——
    # notion 的 tools/list 单行 JSON 响应 ~76KB（实测 6s 正常返回），放宽到 16MB 后正常。
    # 有效 token 在 models.local.yaml 的 mcp_servers.notion.env 覆盖；未配置时调用 401 如实失败。
    enabled: true
    command: cmd
    args: ["/c", "npx", "-y", "@notionhq/notion-mcp-server"]
    request_timeout: 120
    env:
      OPENAPI_MCP_HEADERS: '{"Authorization": "Bearer REDACTED-ROTATE-CREDENTIAL", "Notion-Version": "2022-06-28"}'

# 技能包（生态层）：skills/ 目录，每个技能一个目录（SKILL.md + scripts/），见 docs/SKILLS.md
skills:
  enabled: true
  dir: skills
  timeout: 120

# IM 通知通道（入口层）：计划完成/失败/暂停、待审批、设计书就绪时主动推送（docs/NOTIFY.md）。
# 各通道填 webhook/token 即启用（建议在 models.local.yaml 覆盖，避免 webhook 泄漏）；
# 全部留空 = 仅本地审计 data/notifications.jsonl。events 可裁剪订阅范围。
notify:
  enabled: true
  events: [plan_completed, plan_failed, plan_paused, approval_required, design_ready]
  cooldown_seconds: 300
  feishu:      # 飞书群机器人 webhook：https://open.feishu.cn/open-apis/bot/v2/hook/<token>
    webhook: ""
    secret: ""
  dingtalk:    # 钉钉群机器人 webhook（可加 secret 加签）
    webhook: ""
    secret: ""
  wecom:       # 企业微信群机器人 webhook
    webhook: ""
  telegram:    # Telegram bot（需能直连 api.telegram.org）
    bot_token: ""
    chat_id: ""
  webhook:     # 通用 webhook：POST {event, title, text, payload}
    url: ""

# 应用内置助手（/api/chat）：会话式工具调用，走 Grant 预算约束
chat:
  provider: stepfun
  model: step-3.5-flash-2603
  temperature: 0.3
  max_tool_rounds: 6
  max_tool_calls: 20
  session_ttl_seconds: 3600
  exclude_tools: [http_api, github_operator]
