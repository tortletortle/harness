      provider: stepfun
      temperature: 0.1
  knowledge:
    fallback:
      max_tokens: 4000
      model: step-3.5-flash
      provider: stepfun
      temperature: 0.2
    primary:
      max_tokens: 4000
      model: step-3.7-flash
      provider: stepfun
      temperature: 0.2
  stepfun_asr:
